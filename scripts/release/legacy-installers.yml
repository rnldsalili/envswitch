# M1a only: copy verbatim to .github/workflows/installers.yml when absent.
# M1b replaces this shim with D2b's real reusable installer suites.
name: Legacy installer checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/install-sh.test.sh
