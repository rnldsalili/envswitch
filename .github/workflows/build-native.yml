name: Build native release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: ${{ inputs.tag }}
  SOURCE_SHA: ${{ inputs.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test (${{ matrix.target }}, no OIDC)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    env:
      TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.os == 'windows-2025' && 'python' || 'python3' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Prepare pinned toolchain and stamped checkout
        run: bash scripts/release/prepare-native.sh
      - name: Test target and validate reconciled lockfile
        run: cargo test --workspace --locked --target "$TARGET"

  build:
    name: Native (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    env:
      TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.os == 'windows-2025' && 'python' || 'python3' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Prepare pinned toolchain and stamped checkout
        run: bash scripts/release/prepare-native.sh
      - name: Build release with locked dependencies
        run: cargo build --locked --release --package envswitch --bin envswitch --target "$TARGET"

      - name: Verify Linux binary is static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/envswitch"
          file "$binary"
          readelf --program-headers --wide "$binary" > "$RUNNER_TEMP/program-headers"
          readelf --dynamic --wide "$binary" > "$RUNNER_TEMP/dynamic"
          if grep -q 'INTERP' "$RUNNER_TEMP/program-headers" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic"; then
            echo '::error::Linux release binary has a dynamic interpreter or shared dependency'
            exit 1
          fi

      - name: Verify macOS imports only system libraries
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          otool -L "target/$TARGET/release/envswitch" > "$RUNNER_TEMP/linkage.txt"
          "$PYTHON" scripts/release/release.py check-linkage "$TARGET" "$RUNNER_TEMP/linkage.txt"

      - name: Verify Windows has no dynamic VCRUNTIME dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $report = & $dumpbin /dependents "target/$env:TARGET/release/envswitch.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /dependents failed' }
          $report | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/linkage.txt"
          & $env:PYTHON scripts/release/release.py check-linkage $env:TARGET "$env:RUNNER_TEMP/linkage.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Windows CRT linkage check failed' }

      - name: Verify exact version and package payload
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/envswitch"
          if [[ "$TARGET" == *-windows-msvc ]]; then binary="$binary.exe"; fi
          "$PYTHON" scripts/release/release.py check-version "$VERSION" "$TARGET" --binary "$binary"
          "$PYTHON" scripts/release/release.py package "$VERSION" "$TARGET" --binary "$binary" --output dist/native

      - name: Attest archive only for publication
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/native/*
          create-storage-record: false
      - name: Upload this target only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-${{ matrix.target }}
          path: dist/native/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
