name: Rust check

# Format, lint, and test the Rust workspace on every OS we ship for.
# This workflow never publishes, uploads, or writes anything.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Tests run on the triple each OS ships (as in build-native.yml). On
        # Linux that is musl, not the gnu host default: install receipts only
        # accept release triples, so `update` tests need one (see build.rs).
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # --no-fail-fast reports every failing test binary, not just the first.
      - name: Test
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }}
