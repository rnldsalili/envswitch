name: Release

# Single publisher/version authority: keep this path and its run-number sequence.
# Every push to main builds, verifies and publishes a native release once the native
# builds, installer suites (installers.yml) and oracle parity (parity.yml) all pass;
# publish.py promotes it to latest only in numeric order. A workflow_dispatch verifies
# without publishing unless publish=true, and publication is restricted to main.
# The TypeScript app was removed after the native cutover, so source releases can no
# longer be built (release.py plan refuses them); older source releases stay as published.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        description: Explicit release asset kind
        type: choice
        required: true
        default: native
        options: [native]
      publish:
        description: Publish/promote after all checks (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      kind: ${{ steps.plan.outputs.kind }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan one release identity
        id: plan
        env:
          DISPATCH_KIND: ${{ inputs.kind }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 scripts/release/release.py plan .

  verify:
    name: Verify release helpers
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # Full history: the parity self-check exports the pinned TS oracle commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Release helper tests
        run: python3 -m unittest discover -s test/release -v

  native:
    needs: plan
    if: needs.plan.outputs.kind == 'native'
    # Permission ceiling passed to the reusable workflow's producing jobs only.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-native.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.sha }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}

  package:
    name: Package standalone installers
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Copy standalone scripts byte for byte
        run: |
          set -euo pipefail
          mkdir -p dist/common
          cp scripts/install.sh scripts/install.ps1 dist/common/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-common
          path: dist/common/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  installers:
    name: Required installer suites
    needs: plan
    uses: ./.github/workflows/installers.yml

  parity:
    name: Required oracle parity (native)
    needs: plan
    if: needs.plan.outputs.kind == 'native'
    uses: ./.github/workflows/parity.yml

  assemble:
    name: Assemble and verify complete asset set (also on pushes)
    needs: [plan, verify, native, package]
    if: >-
      always() && needs.plan.result == 'success' && needs.verify.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      KIND: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # A pattern that matches a single artifact extracts it straight into `path` with no
      # container directory, so release-common (the only artifact of a source release) is
      # downloaded by name into its own directory and the native ones by pattern.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-common
          path: dist/artifacts/release-common
      - if: needs.plan.outputs.kind == 'native'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-native-*
          path: dist/artifacts
          merge-multiple: false
      - name: Validate exact artifact containers and assets and generate SHA256SUMS
        run: python3 scripts/release/release.py collect dist/artifacts dist/verified "$KIND" "$VERSION"
      - name: Preserve verified assets for the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: dist/verified/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Draft, verify, then promote
    # Builds cannot cancel a pending publication.
    # Concurrency is not FIFO, so publish.py still checks numeric latest ordering.
    concurrency:
      group: envswitch-publish
      cancel-in-progress: false
    needs: [plan, verify, native, package, installers, parity, assemble]
    if: >-
      always() && !cancelled() && needs.plan.outputs.publish == 'true' &&
      github.ref == 'refs/heads/main' && needs.verify.result == 'success' &&
      needs.package.result == 'success' && needs.installers.result == 'success' &&
      needs.parity.result == 'success' && needs.assemble.result == 'success' &&
      needs.native.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      KIND: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist/publish
      - name: Verify downloaded assets and publish idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish.py "$GITHUB_REPOSITORY" dist/publish "$KIND" "$VERSION" "$TAG" "$SOURCE_SHA"
