name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

  release:
    name: Build and publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build release assets
        run: |
          set -euo pipefail

          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          PACKAGE_DIR="dist/release/envswitch"

          rm -rf release dist/release
          mkdir -p release "$PACKAGE_DIR"

          cp package.json bun.lock README.md tsconfig.json "$PACKAGE_DIR/"
          cp -R src scripts "$PACKAGE_DIR/"

          tar -C dist/release -czf "release/envswitch_${VERSION}_source.tar.gz" envswitch

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v0.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --generate-notes --latest
