name: Installer protocol
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
permissions:
  contents: read
jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n scripts/install.sh test/install-sh.test.sh
      - run: bash test/install-sh.test.sh
      - run: if command -v shellcheck >/dev/null; then shellcheck scripts/install.sh test/install-sh.test.sh; fi
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./test/install-ps.Tests.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./test/install-ps.Tests.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./test/install-ps.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
