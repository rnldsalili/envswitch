name: Oracle parity
on:
  pull_request:
    paths: ['parity/**', 'crates/**', 'Cargo.*', 'docs/rust-port/**', '.github/workflows/parity.yml']
  push:
    branches: [rust-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ts-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Materialize pinned TS oracle
        run: bun parity/oracle/materialize.ts "${RUNNER_TEMP}/envswitch-oracle"
      - name: Build native fake-op and generate or verify OS goldens
        env:
          ENVSWITCH_ORACLE_DIR: ${{ runner.temp }}/envswitch-oracle
        run: |
          # generate.ts builds/tests/clippies fake-op in an isolated copy, without touching Cargo.lock.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash parity/gen.sh --check
          else
            bash parity/gen.sh
          fi
      - name: Reproduce TS transcripts (TS-vs-TS)
        env:
          ENVSWITCH_ORACLE_DIR: ${{ runner.temp }}/envswitch-oracle
        run: |
          bash parity/gen.sh --check
          bun test parity/self-check.test.ts
          bun "$ENVSWITCH_ORACLE_DIR/node_modules/typescript/bin/tsc" -p parity/tsconfig.json --typeRoots "$ENVSWITCH_ORACLE_DIR/node_modules/@types"
      - name: Rust adapter — phase 2 placeholder
        run: echo "TODO F1 phase 2 — run the Rust adapter on these scenarios and apply approved replacement assertions."
